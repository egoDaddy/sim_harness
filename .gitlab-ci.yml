# ============================================================================
# harness 仓 (xuhua/sim_harness) 的 pipeline 定义
#
# 为什么是 shell executor + GIT_STRATEGY=none:
#   - CARLA 是常驻服务 (localhost:2000), 世界由 scenario_runner 加载;
#     autoware / scenario_runner / map 全是 /home 绝对路径, 只能跑在这台机器上
#   - 本文件随 harness 仓推送到 GitLab, 但执行用 runner 所在机器的固定工作区,
#     因此必须用 $CI_COMMIT_SHA 核对工作区 HEAD (contract job 第一步)
#
# 阶段:
#   contract  秒级: 工作区=本次提交 + 跨仓契约 C1~C7 (暂不 --strict, WARN 只打印)
#   build     分钟级: colcon build + console script 存在性
#   sim:smoke 十分钟级: 单场景跑批 -> judge_run_summary.py 按 run_summary.json 判定
#   report    秒级: 汇总 attempt 台账 -> 指标 (不占 CARLA, sim 失败也跑)
#
# 判定原则: ros2 launch 的返回码不可信, 唯一来源是 run_summary.json 的
#           summary.exit_code (0 通过 / 1 编排异常 / 2 测试失败 / 3 结论不可靠)
# ============================================================================
stages: [contract, build, sim, report]

variables:
  # 不 clone: runner 直接操作固定工作区 (否则 builds/ 里的副本没有
  # autoware install / CARLA / map, 跑不起来)
  GIT_STRATEGY: none
  ASR_WS: "/home/carla_disk/carla_project/autoware_srunner_ws"
  AUTOWARE_WS: "/home/xuhua/autoware"
  CARLA_PY: "/home/carla_disk/carla/PythonAPI/carla"
  CARLA_CUDART: "/usr/local/cuda/lib64/libcudart.so"
  # pipeline 产物落在 CI_PROJECT_DIR 内, artifacts 才能被 runner 收集
  CI_OUT: "$CI_PROJECT_DIR/ci_out"
  # 70 min 墙钟兜底。推导: lidar_fault_matrix.json 固定 50 条 (1 场景 x 50 故障
  # 组合), pipeline#40 的 launch.log 相邻场景时间戳实测 64.6~75.0s/条 (均值 ~67s),
  # 50 x 67s ~ 3350s, 再留 ~25% 给启动清场 / 单条偏慢 / 收尾。
  # 注意: 这个值必须 > 单条偏慢时的累计, 否则会出现"跑到第 20 条被 timeout 掐断"
  # 又被误读成"批量中止没修好"; 同时本 job 的 timeout 必须 > 本值 + 180。
  SIM_TIMEOUT: "4200"

default:
  tags: [carla-sim]            # 只匹配仿真机上的 shell runner (docker1 不接)
  interruptible: false         # 跑批中不许被新 pipeline 抢占
  # job 级 retry 只兜"执行环境抖动"(GitLab 调度/接口 + runner 宿主机),
  # 三类都是 GitLab 能精确识别的原因码:
  #   runner_system_failure : runner 进程崩 / 机器重启 / 磁盘满 / OOM
  #   scheduler_failure     : GitLab 调度侧故障
  #   api_failure           : GitLab 接口调用失败
  # 刻意不含 script_failure: 场景判定失败 / 契约 FAIL / 编译错误 / CARLA 进程已死
  # 都是同输入必然同输出的确定性失败, 重试只会白烧时间并掩盖缺陷。
  # 刻意不含 stuck_or_timeout_failure: 它指向流水线自身的时间行为
  # (收尾收不回来 / 场景数 x 单场景兜底逼近 timeout), 重放同路径不会变好。
  # 注意: 不要写成 `retry: 2` 简写 —— 不带 when 时等价于 when: always。
  retry:
    max: 1
    when:
      - runner_system_failure
      - scheduler_failure
      - api_failure

# --------------------------------------------------------------- 1. 契约校验
contract:
  stage: contract
  # 刻意不占 resource_group: carla_sim —— 本 job 只读文件 + 写 ci_out/contract,
  # 不碰 CARLA / DDS / install 空间。占锁会让 sim 跑批 (5~15 min) 期间所有
  # 后到 pipeline 的秒级契约校验跟着排队, 表现为"网页点了没反应"。
  # (build 必须留在锁内: 它写 install/ 而 sim 正在 source 同一个 install/)
  timeout: 10m
  script:
    - set -euo pipefail
    - |
      echo "== [1/4] 工作区版本 = 本次提交 =="
      cd "$ASR_WS"
      HARNESS_HEAD=$(git -C src/autoware_srunner rev-parse HEAD)
      if [ "$HARNESS_HEAD" != "$CI_COMMIT_SHA" ]; then
        echo "FAIL: 工作区 HEAD=$HARNESS_HEAD, 本次提交=$CI_COMMIT_SHA"
        echo "      -> 在仿真机执行: git -C $ASR_WS/src/autoware_srunner fetch origin"
        echo "         git -C $ASR_WS/src/autoware_srunner checkout $CI_COMMIT_SHA"
        exit 1
      fi
      echo "ok: $HARNESS_HEAD"
    - |
      echo "== [2/4] 准备干净输出目录 =="
      rm -rf "$CI_OUT/contract" && mkdir -p "$CI_OUT/contract"
    - |
      echo "== [3/4] 跨仓契约 C1~C7 (FAIL 拦, WARN 只打印) =="
      set +e
      python3 src/autoware_srunner/autoware_srunner/scenario_contract_check.py \
        --results-root "$CI_OUT/contract" \
        --json "$CI_OUT/contract/contract.json"
      RC=$?
      set -e
      echo "== [4/4] 转 JUnit (只做展示, 不参与判定) =="
      # 判定仍然只看上面那条命令的退出码; 转换失败不允许改变结论
      python3 src/autoware_srunner/ci/junit_report.py \
        --contract "$CI_OUT/contract/contract.json" \
        --out "$CI_OUT/contract/junit.xml" || true
      exit "$RC"
  artifacts:
    when: always
    expire_in: 2 weeks
    paths: ["ci_out/contract/"]
    reports:
      junit: ci_out/contract/junit.xml

# --------------------------------------------------------------- 2. 构建
build:
  stage: build
  timeout: 20m
  needs: [contract]
  script:
    # ROS 的 setup.bash 不是 -u 安全的 (会碰 AMENT_TRACE_SETUP_FILES 等未定义变量),
    # 所以先 source, 再开 -u。顺序反过来 job 会在 1s 内挂。
    - set -eo pipefail
    - cd "$ASR_WS"
    - source /opt/ros/humble/setup.bash
    - set -u
    - colcon build --symlink-install --packages-select autoware_srunner autoware_srunner_msgs
    - |
      echo "== console script 存在性 =="
      for e in scenario_monitor scenario_contract_check set_route \
               trajectory_publisher destroy_actors wait_for_ready; do
        test -x "install/autoware_srunner/lib/autoware_srunner/$e" \
          || { echo "FAIL: 缺 console script $e"; exit 1; }
      done
      echo "ok: 12 个入口齐全"

# --------------------------------------------------------------- 3. 冒烟跑批
sim:smoke:
  stage: sim
  resource_group: carla_sim
  needs: [build]
  # 80 min = SIM_TIMEOUT(4200s) + 180s 收组余量 + 预检/after_script。
  # 本值若被项目级 Settings>CI/CD>Timeout 压小, GitLab 会先取消 job 并报
  # stuck_or_timeout_failure, 此时需同步调大项目级 timeout。
  timeout: 80m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    # 刻意不用 set -e: launch 与清理步骤允许非零, 结论只认 judge 的退出码
    # 同样先 source (非 -u 安全) 再开 -u
    - set -o pipefail
    # CI 无头: 抹掉 DISPLAY, 避免任何节点 (rviz2) 抢 GPU 卡住跑批
    - unset DISPLAY
    - cd "$ASR_WS"
    - source /opt/ros/humble/setup.bash
    - source "$AUTOWARE_WS/install/setup.bash"
    - source install/setup.bash
    - set -u
    # DDS 统一: runner 是 systemd 服务不继承用户 .bashrc (RMW_IMPLEMENTATION=
    # rmw_cyclonedds_cpp), 默认 fastrtps 在大拓扑下发现/匹配慢 (transient_local
    # late-joiner 延迟、load_node 概率卡死); 本地 50 条连跑通跑环境即 cyclonedds
    - export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    - |
      echo "== [attempt] 台账: 归档上一次尝试, 记录本次序号 =="
      # 为什么必须在 rm -rf 之前: 重试时上一次的 launch.log / run_summary.json
      # 会被下面的 rm 删掉, 且 GitLab 只保留最后一次 attempt 的 artifacts。
      # 先搬进台账, 才能事后对比"第一次为什么失败"。
      LEDGER="$CI_OUT/attempts/$CI_PIPELINE_ID"
      mkdir -p "$LEDGER"
      # 坑: runner 的 job 脚本隐含 set -e, 而 grep -c 无匹配时退出码是 1、
      # 配合 pipefail 会让 $( ... ) 返回 1, 于是赋值语句失败 -> 整个 job 静默
      # 中止 (只留下空台账目录, 无任何报错). 必须 || true 兜住退出码.
      N=$(ls -1 "$LEDGER" 2>/dev/null | grep -c '^attempt_' || true)
      SEQ=$(( ${N:-0} + 1 ))
      ATT="$LEDGER/$(printf 'attempt_%02d' "$SEQ")"
      mkdir -p "$ATT"
      if [ -d "$CI_OUT/sim" ]; then
        mv "$CI_OUT/sim" "$ATT/prev_sim"
        echo "  上一次尝试的产物已归档 -> $ATT/prev_sim"
      fi
      {
        echo "pipeline_id=$CI_PIPELINE_ID"
        echo "job_id=$CI_JOB_ID"
        echo "job_name=$CI_JOB_NAME"
        echo "seq=$SEQ"
        echo "started_at=$(date -Is)"
      } > "$ATT/meta.env"
      echo "$ATT" > "$LEDGER/.current_attempt"
      echo "本次尝试: attempt_$(printf '%02d' "$SEQ") -> $ATT"
    - rm -rf "$CI_OUT/sim" && mkdir -p "$CI_OUT/sim"
    - |
      echo "== [0a/4] 生成 CI 专用编排配置 (关 rviz + 收紧失败兜底) =="
      # monitor 每场景 relaunch e2e, rviz 常开会反复开窗 + 吃 GPU;
      # CI 无人看画面 -> 用配置副本把 lifecycle.cycle.rviz 改成 false
      CI_CFG="$CI_OUT/asr_ci.yaml"
      cp "$ASR_WS/src/autoware_srunner/config/autoware_srunner.yaml" "$CI_CFG"
      sed -i -E 's/^([[:space:]]{4})rviz: true/\1rviz: false/' "$CI_CFG"
      # 冒烟调试提速: 下面四个只是"失败兜底上限", 正常路径走到即结束, 不受影响.
      # 场景 Act 仿真时长 60s (StopTrigger), 按 1.9x 墙钟换算 ~114s,
      # 420s 已留约 4x 余量; 注入链夭折由 monitor 立即中止 (不再等满).
      sed -i -E 's/scenario_timeout_s: [0-9.]+/scenario_timeout_s: 420.0/' "$CI_CFG"
      sed -i -E 's/e2e_ready_wait_s: [0-9.]+/e2e_ready_wait_s: 120.0/' "$CI_CFG"
      sed -i -E 's/e2e_shutdown_wait_s: [0-9.]+/e2e_shutdown_wait_s: 30.0/' "$CI_CFG"
      sed -i -E 's/inject_kill_wait_s: [0-9.]+/inject_kill_wait_s: 5.0/' "$CI_CFG"
      sed -i -E 's/wait_timeout_s: [0-9.]+/wait_timeout_s: 150.0/' "$CI_CFG"
      grep -nE '^ +rviz:' "$CI_CFG"
      grep -qE '^ {4}rviz: false' "$CI_CFG" || { echo "FAIL: rviz 未改成 false"; exit 1; }
      grep -nE 'scenario_timeout_s|e2e_ready_wait_s|e2e_shutdown_wait_s|inject_kill_wait_s|wait_timeout_s' "$CI_CFG"
    - |
      echo "== [0b/4] 进程清场: 杀上一轮残留的 e2e / autoware / scenario_runner =="
      # 残留 e2e 会让 monitor 的 _routing_service_ready() 误判秒开跑; 孤儿
      # scenario_runner.py 会继续持有 Traffic Manager 的 8000 端口使新场景
      # ERROR。清场逻辑见 ci/cleanup_processes.py (纯 python + /proc 扫描,
      # 排除自身祖先链, 不依赖 pgrep/ss 等 runner 环境可能没有的工具)。
      python3 "$ASR_WS/src/autoware_srunner/ci/cleanup_processes.py"
      # FastDDS 共享内存段残留会占满端口 (open_and_lock_file failed) 并污染发现
      rm -f /dev/shm/fastrtps_* /dev/shm/sem.fastrtps* 2>/dev/null || true
    - |
      echo "== [0/4] 清场: 先销毁上一轮残留 actor, 再跑 (否则重复 ego / 孤儿传感器) =="
      env PYTHONPATH="$CARLA_PY:${PYTHONPATH:-}" LD_PRELOAD="$CARLA_CUDART" \
        install/autoware_srunner/lib/autoware_srunner/destroy_actors \
          --host localhost --port 2000 || true
    - |
      echo "== [1/4] CARLA 预检 (3 次 x 5s, 只吸收刚启动未就绪这类瞬时抖动) =="
      # 预检失败在 GitLab 眼里是 script_failure, 但它的性质是"外部依赖瞬时不可用":
      # 在脚本内 15s 内能吸收掉, 就不必让整个 job 重跑 2 分钟。
      # 若 CARLA 进程已死 (RequestExit 退出), 3 次都会失败 -> 明确报错要求人工启动,
      # 不靠 job 级 retry 掩盖。
      CARLA_OK=0
      for i in 1 2 3; do
        if env PYTHONPATH="$CARLA_PY:${PYTHONPATH:-}" LD_PRELOAD="$CARLA_CUDART" \
          python3 -c "import carla;c=carla.Client('localhost',2000);c.set_timeout(5);print('CARLA server', c.get_server_version())"; then
          CARLA_OK=1; echo "  CARLA 预检第 $i 次通过"; break
        fi
        echo "  CARLA 预检第 $i 次失败, 5s 后重试"
        sleep 5
      done
      if [ "$CARLA_OK" != 1 ]; then
        echo "FAIL: CARLA 预检 3 次全部失败 (localhost:2000)"
        echo "      -> 在仿真机执行: cd ~/carla && make launch"
        exit 1
      fi
    - |
      echo "== [2/4] 跑批 (setsid 独立进程组; 收尾强制收组) =="
      # monitor 退出后 ros2 launch 常因某个子节点不响应 SIGINT 而卡住不返回,
      # 让 job 一直挂到超时 (实测挂过 10 min+ 直到人工 kill), 故用 setsid 建组
      # 并在 run_summary 落盘后 / 墙钟到期时按进程组强杀收尾。
      WALL=$((SIM_TIMEOUT + 180))
      setsid timeout --signal=INT --kill-after=120 "$WALL" \
        ros2 launch autoware_srunner autoware_srunner_launch.py \
          asr_config:="$CI_OUT/asr_ci.yaml" \
          scenario_root:="$ASR_WS/scenarios" \
          fault_root:="$ASR_WS/fault" \
          results_dir:="$CI_OUT/sim" \
          fault_matrix:="${FAULT_MATRIX:-lidar_fault_matrix.json}" \
          orchestration:=auto \
        > "$CI_OUT/sim/launch.log" 2>&1 &
      LPID=$!
      WAITED=0
      while kill -0 "$LPID" 2>/dev/null; do
        if [ -f "$CI_OUT/sim/run_summary.json" ]; then
          echo "  run_summary 已落盘, 3s 后收组"
          sleep 3; break
        fi
        if [ "$WAITED" -ge "$WALL" ]; then echo "  墙钟到期, 强制收组"; break; fi
        sleep 2; WAITED=$((WAITED + 2))
      done
      kill -TERM -"$LPID" 2>/dev/null || true
      sleep 5
      kill -KILL -"$LPID" 2>/dev/null || true
      wait "$LPID" 2>/dev/null || true
      echo "  编排器已收组 (launch.log $(wc -l < "$CI_OUT/sim/launch.log" 2>/dev/null || echo 0) 行)"
    - |
      echo "== [3/4] 判定 (唯一可信来源 = run_summary.json) =="
      # 捕获退出码而不是让它直接终止: 后面要先落 JUnit + attempt 台账再退出。
      # 否则 job 一失败, 页面就只剩下一个人眼看得到的退出码。
      ATT=$(cat "$CI_OUT/attempts/$CI_PIPELINE_ID/.current_attempt" 2>/dev/null || true)
      set +e
      python3 src/autoware_srunner/ci/judge_run_summary.py \
        --summary "$CI_OUT/sim/run_summary.json"
      RC=$?
      # JUnit / 台账只做展示与统计, 失败不允许改变结论 (故一律 || true)
      python3 src/autoware_srunner/ci/junit_report.py \
        --sim "$CI_OUT/sim/run_summary.json" \
        --out "$CI_OUT/sim/junit.xml" || true
      # ATT 为空时宁可不记账, 也不要把 result.json 写到工作区当前目录
      if [ -n "${ATT:-}" ]; then
        python3 src/autoware_srunner/ci/record_attempt.py \
          --attempt-dir "$ATT" \
          --summary "$CI_OUT/sim/run_summary.json" \
          --judge-rc "$RC" || true
      else
        echo "[warn] 未找到本次 attempt 目录, 跳过台账记录"
      fi
      echo "== [4/4] 完成 (judge rc=$RC) =="
      exit "$RC"
  after_script:
    # 无论 job 怎么结束都补一刀清场 (强杀/超时路径不走 launch 的 OnShutdown)
    - |
      cd "$ASR_WS" && source install/setup.bash 2>/dev/null
      env PYTHONPATH="$CARLA_PY:${PYTHONPATH:-}" LD_PRELOAD="$CARLA_CUDART" \
        install/autoware_srunner/lib/autoware_srunner/destroy_actors \
          --host localhost --port 2000 || true
  artifacts:
    when: always
    expire_in: 2 weeks
    paths: ["ci_out/sim/", "ci_out/attempts/"]
    reports:
      junit: ci_out/sim/junit.xml

# --------------------------------------------------------------- 4. 汇总指标
# 第一批指标 (attempt / flaky / 确定重复); 通过率、时长等留给后续。
# 刻意不占 carla_sim 锁: 只读 ci_out/attempts + 调一次只读 API。
# 用独立 stage 而不是 needs: sim:smoke 被 rules 跳过时本 job 照样跑 (输出 0 次尝试),
# needs 写法则会被跳过而无法区分"没跑"和"跑了 0 次"。
metrics:pipeline:
  stage: report
  timeout: 5m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: always
  script:
    - set -o pipefail
    - cd "$ASR_WS"
    - mkdir -p "$CI_OUT/metrics"
    - |
      # API 对账只是"顺带校验", 参数缺失/网络不通都不能让本 job 失败
      python3 src/autoware_srunner/ci/collect_attempts.py \
        --ledger "$CI_OUT/attempts/$CI_PIPELINE_ID" \
        --attempts-root "$CI_OUT/attempts" \
        --keep 10 \
        --out "$CI_OUT/metrics/attempts.txt" \
        --job-name "sim:smoke" \
        --api-url "${CI_API_V4_URL:-}" \
        --project-id "${CI_PROJECT_ID:-}" \
        --pipeline-id "${CI_PIPELINE_ID:-}" \
        --token "${CI_JOB_TOKEN:-}"
    - cat "$CI_OUT/metrics/attempts.txt"
  artifacts:
    when: always
    expire_in: 1 month
    paths: ["ci_out/metrics/", "ci_out/attempts/"]
    reports:
      metrics: ci_out/metrics/attempts.txt
